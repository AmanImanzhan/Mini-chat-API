services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: minichat
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d minichat"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/minichat
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 4001
    ports:
      - "4001:4001"

volumes:
  db-data:
